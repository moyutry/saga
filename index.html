    <script>
      // Apply saved language/theme before first paint (no flash).
      try {
        var b = JSON.parse(localStorage.getItem('velvet.boot') || '{}');
        var lang = b.lang === 'en' ? 'en' : 'he';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
        document.documentElement.dataset.theme = b.theme || 'dark';
        if (b.accent) document.documentElement.style.setProperty('--accent', b.accent);
        if (b.accent2) document.documentElement.style.setProperty('--accent-2', b.accent2);
      } catch (e) {}
      if (/^#\/(subs|player)/.test(location.hash)) document.documentElement.classList.add('aux-window');
      if (/^#\/subs/.test(location.hash)) document.documentElement.classList.add('subs-window');
    </script>
