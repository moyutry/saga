<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07060b" />
    <title>Iris</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07060b; color: #f7f5fc; font-family: system-ui, sans-serif; }
      body { display: grid; place-items: center; text-align: center; }
      a { color: #c4b5fd; }
    </style>
    <script>
      // Saga is now Iris. Your data lives on this same address (moyutry.github.io), so it carries over.
      // Drop the old offline copy (service worker + cache) first, then go to the new address, keeping any #link.
      (async function () {
        var next = '../iris/' + location.search + location.hash;
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.filter(function (r) { return r.scope.indexOf('/saga/') > -1; }).map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.filter(function (k) { return /workbox-precache/.test(k); }).map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        location.replace(next);
      })();
    </script>
  </head>
  <body>
    <p>Saga → <a href="../iris/">Iris</a></p>
  </body>
</html>
